name: Test

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [reformatters-main-push]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dynamical-org/reformatters
          path: reformatters
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --group integration
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest tests/ --ignore=tests/test_released_catalog_read.py --ignore=tests/test_stac_drift.py
        env:
          REFORMATTERS_DIR: ${{ github.workspace }}/reformatters

  # Committed stac/ must match a fresh generate(). Its own job, separate from
  # `test`, because its failure means one of two different things and the
  # test says which: a dataset store changed after the last regen (STORE
  # DRIFT, main needs a regen commit, nobody broke anything) or this branch
  # changed src/ without running scripts/generate. Classifying needs the base
  # ref's src/ and stac/, hence the fetch of main. On a push to main every
  # mismatch is store drift by construction, and notify-on-drift files it as
  # such instead of leaving main red with no stated reason.
  stac-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --no-tags --depth=1 origin main
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync
      - run: uv run pytest tests/test_stac_drift.py -m integration -v

  notify-on-drift:
    needs: stac-drift
    if: failure() && (github.event_name == 'push' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the regen issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Catalog needs regen: a dataset store changed"
        run: |
          body="A dataset store changed after the last \`scripts/generate\`, so the committed \`stac/\` no longer matches it. Nothing in this repo broke; run \`./scripts/generate\` on main and commit the result.

          Run: ${RUN_URL}"
          existing=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  # Per-target compatibility checks. Each matrix entry shows up as its own
  # PR status check (via the job-level `name:` template) so a breaking
  # change surfaces as `compat (0.5.0) ❌` rather than hiding inside the
  # main test job.
  #
  # The matrix is built fresh on every run by scripts/compat_matrix.py:
  # every non-yanked stable dynamical-catalog release on PyPI (>= the
  # MIN_VERSION floor in that script) plus every entry in CANARY_REFS.
  # That means a newly-published release lands in the matrix on the
  # next CI run with no edits here or in the test file.
  #
  # Each `include` entry the script emits carries:
  #   target:        the human-readable thing we're testing (PyPI version
  #                  or git ref), shown in the status check name.
  #   id:            the shell-safe pytest parametrize id used for the -k
  #                  filter — alphanumerics + underscore only, so `[`/`.`
  #                  in semver versions can't trip pytest's -k parser.
  #   allow-failure: false for PyPI releases (support contract); true for
  #                  canary refs like `main`, where a dynamical-catalog
  #                  breakage shouldn't block dynamical-stac PRs.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stdlib-only script; no `uv sync` needed, runs in ~1 second.
      - id: build
        run: python scripts/compat_matrix.py >> "$GITHUB_OUTPUT"

  compat:
    needs: discover
    name: "compat (${{ matrix.target }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --group integration
      # matrix.id is passed via an env var rather than interpolated into the
      # script so a malicious value can't inject shell commands (matrix values
      # trace back to PyPI release metadata via the discover job).
      - run: uv run pytest tests/test_released_catalog_read.py -m integration -k "$TARGET_ID" -v
        env:
          TARGET_ID: ${{ matrix.id }}

  # Fixed-name aggregate of the whole compat matrix. Branch protection requires
  # this context instead of the per-target `compat (...)` ones, whose names come
  # and go with PyPI releases; a required context that stops being reported
  # blocks every PR indefinitely. `always()` means a discover failure, which
  # leaves compat skipped rather than failed, is caught here too.
  compat-required:
    needs: compat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.compat.result }}
        run: test "$RESULT" = success

  notify-on-failure:
    needs: test
    if: failure() && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "STAC version check failed after reformatters push" \
            --body "Triggered by reformatters ref \`${DISPATCH_REF}\` at \`${DISPATCH_SHA}\`.

          Run: ${RUN_URL}"
