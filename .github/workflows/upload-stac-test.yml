name: Upload test STAC catalog

# Deploys the committed `stac-test/` tree to stac-test.dynamical.org from `main`,
# without regenerating. The test catalog is a superset of staging: every
# production and staging dataset plus the CatalogItem.test=True fixture datasets
# consumed by dynamical-catalog's integration tests, with the test root href,
# written by `scripts/generate`. Staging (upload-stac-staging.yml) and
# production (upload-stac.yml) leave the fixture datasets out.

on:
  push:
    branches: [main]
    paths: ["stac-test/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-stac-test
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Upload to test R2 bucket
        run: uv run --locked python src/__main__.py upload stac-test
        env:
          R2_BUCKET: stac-test
          R2_ENDPOINT_URL: ${{ secrets.R2_STAC_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_STAC_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_STAC_SECRET_ACCESS_KEY }}
