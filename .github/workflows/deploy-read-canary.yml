name: Deploy read canary to Modal

on:
  push:
    branches: [main]
    paths:
      - scripts/read_canary.py
      - .github/workflows/deploy-read-canary.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-read-canary
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch can target any branch; never expose prod Modal
    # credentials to a deploy from anything but main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Install deployment dependencies
        run: uv sync --locked --only-group deploy
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --no-sync modal deploy scripts/read_canary.py
