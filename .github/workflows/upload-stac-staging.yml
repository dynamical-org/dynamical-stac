name: Upload staging STAC catalog

# Deploys the committed `stac-staging/` tree to stac-staging.dynamical.org from
# `main`. Like production it uploads what was reviewed and merged, without
# regenerating: the tree carries the CatalogItem.staging=True datasets and the
# staging root href, written by `scripts/generate`.

on:
  push:
    branches: [main]
    paths: ["stac-staging/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-stac-staging
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Upload to staging R2 bucket
        run: uv run --locked python src/__main__.py upload stac-staging
        env:
          R2_BUCKET: stac-staging
          R2_ENDPOINT_URL: ${{ secrets.R2_STAC_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_STAC_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_STAC_SECRET_ACCESS_KEY }}
