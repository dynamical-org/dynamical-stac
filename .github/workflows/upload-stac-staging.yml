name: Upload staging STAC catalog

# Deploys the committed `stac-staging/` tree to stac-staging.dynamical.org from
# `main`. Like production it uploads what was reviewed and merged, without
# regenerating: the tree carries items listing the staging environment and the
# staging root href, written by `scripts/generate`.

on:
  push:
    branches: [main]
    paths: ["stac-staging/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-stac-staging
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --only-group upload
      - name: Upload to staging R2 bucket
        run: uv run --no-sync python src/upload.py stac-staging
        env:
          R2_BUCKET: stac-staging
          R2_ENDPOINT_URL: ${{ secrets.R2_STAC_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_STAC_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_STAC_SECRET_ACCESS_KEY }}
